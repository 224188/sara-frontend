<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARA - Boss's AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #1f1f1f; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; color: #ff9800; }
        .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .user { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .sara { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 10px; background-color: #1f1f1f; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background-color: #2d2d2d; color: white; font-size: 16px; outline: none; }
        button { background-color: #ff9800; color: black; border: none; padding: 0 20px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #555; color: #888; }
    </style>
</head>
<body>

    <div class="header">SARA — Boss ka AI Dashboard</div>
    <div class="chat-container" id="chatContainer">
        <div class="message sara">Pranam Boss! SARA active hai. Bataiye aaj kya madad karu aapki?</div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="SARA se kuch puchiye Boss..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">Bhejo</button>
    </div>

    <script>
        // Aapka backend Render URL jo humne abhi banaya tha
        const BACKEND_URL = "https://onrender.com";
        const sessionId = "boss_mobile_session";

        async function sendMessage() {
            const input = document.getElementById("msgInput");
            const btn = document.getElementById("sendBtn");
            const text = input.value.trim();
            if (!text) return;

            // User ka message screen par dikhao
            appendMessage(text, "user");
            input.value = "";
            input.disabled = true;
            btn.disabled = true;

            try {
                // Render Backend ko request bhejna
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });
                
                const data = await response.json();
                if (data.response) {
                    appendMessage(data.response, "sara");
                } else {
                    appendMessage("Kuch gadbad hui Boss, dimaag response nahi de raha.", "sara");
                }
            } catch (error) {
                appendMessage("Network error Boss! Lagta hai Render server so raha hai.", "sara");
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById("chatContainer");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
