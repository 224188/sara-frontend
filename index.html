<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SARA AI</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .main-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .avatar-img-box { width: 220px; height: 220px; border-radius: 50%; border: 3px solid #ff9800; box-shadow: 0 0 25px rgba(255,152,0,0.2); cursor: pointer; position: relative; overflow: hidden; background: #000; }
        .avatar-img-box.listening { border-color: #4caf50; box-shadow: 0 0 35px rgba(76,175,80,0.6); animation: p 1.5s infinite; }
        .base-face { width: 100%; height: 100%; object-fit: cover; }
        .lip { position: absolute; top: 52%; left: 47%; width: 12%; height: 6%; background: #ffb74d; border-radius: 50%; display: none; transform: translateX(-50%); border: 2px solid #263238; }
        .avatar-name { margin: 15px 0 0 0; font-size: 26px; font-weight: bold; }
        .avatar-status { margin: 5px 0 0 0; font-size: 13px; color: #4caf50; }
        .status-text { color: #888; font-style: italic; font-size: 14px; margin-top: 20px; text-align: center; max-width: 80%; }
        .dashboard-panel { width: 400px; height: 100%; border-left: 1px solid #222; background: #000; padding: 20px; display: none; flex-direction: column; box-sizing: border-box; }
        .widget { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #222; }
        @keyframes p { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @media (max-width: 768px) { .dashboard-panel { position: absolute; top: 0; right: 0; width: 100%; } }
    </style>
</head>
<body>
    <div class="main-chat">
        <div class="avatar-img-box" id="avatarBox" onclick="startVoiceListening()">
            <img src="https://unsplash.com" class="base-face">
            <div id="saraLips" class="lip"></div>
        </div>
        <h2 class="avatar-name">SARA</h2>
        <div class="avatar-status" id="saraLiveStatus">● ONLINE</div>
        <div class="status-text" id="voiceStatusText">Tap SARA's face to talk...</div>
    </div>
    <div class="dashboard-panel" id="secretDashboard">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #222; padding-bottom:10px;">
            <h3>Executive Dashboard</h3><button style="background:none; border:none; color:#ff3b30; font-size:18px; cursor:pointer;" onclick="setDashboardView(false)">Close ✕</button>
        </div>
        <div style="margin-top:20px; flex:1; overflow-y:auto;">
            <div class="widget"><h4 style="color:#ff9800;">📊 Trading Desk Alerts</h4><p style="font-size:13px; color:#aaa;">● NIFTY 24,500 — <span style="color:#4caf50;">HIT ✔</span></p></div>
            <div class="widget"><h4 style="color:#2196f3;">🧠 SARA Brain</h4><p style="color:#aaa; font-size:13px;">Gemini 2.5 Flash Live</p></div>
        </div>
    </div>
    <script>
        // Connected to your verified live Render endpoint
        const BACKEND_BASE = "https://sara-backend-an88.onrender.com";
        const sessionId = "boss_mobile_session";
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null, isSpeakingOrListening = false;

        function triggerLipSync(speak) {
            const lips = document.getElementById("saraLips"); clearInterval(window.lipsInterval);
            if (speak) { lips.style.display = "block"; window.lipsInterval = setInterval(() => { lips.style.height = lips.style.height === "3%" ? "8%" : "3%"; }, 120); } 
            else { lips.style.display = "none"; }
        }
        if (SpeechRecognition) {
            recognition = new SpeechRecognition(); recognition.continuous = false; recognition.lang = 'hi-IN';
            recognition.onstart = () => { isSpeakingOrListening = true; document.getElementById("avatarBox").classList.add("listening"); document.getElementById("saraLiveStatus").innerText = "● LISTENING"; document.getElementById("voiceStatusText").innerText = "Listening, Boss..."; };
            recognition.onerror = () => resetToIdleState();
            recognition.onend = () => document.getElementById("avatarBox").classList.remove("listening");
            recognition.onresult = async (e) => { const txt = e.results.transcript; document.getElementById("voiceStatusText").innerText = `You: "${txt}"`; await sendPayload(txt); };
        }
        function startVoiceListening() { if (recognition && !isSpeakingOrListening) { window.speechSynthesis.cancel(); recognition.start(); } }
        function resetToIdleState() { isSpeakingOrListening = false; triggerLipSync(false); document.getElementById("saraLiveStatus").innerText = "● ONLINE"; document.getElementById("voiceStatusText").innerText = "Tap SARA's face to talk again..."; }
        function setDashboardView(show) { document.getElementById("secretDashboard").style.display = show ? "flex" : "none"; }
        
        async function sendPayload(text) {
            const st = document.getElementById("voiceStatusText"); 
            document.getElementById("saraLiveStatus").innerText = "● THINKING"; 
            st.innerText = "SARA soch rahi hai...";
            try {
                const r = await fetch(`${BACKEND_BASE}/chat`, { 
                    method: "POST", 
                    headers: { 
                        "Accept": "application/json",
                        "Content-Type": "application/json" 
                    }, 
                    body: JSON.stringify({ "session_id": sessionId, "message": String(text) }) 
                });
                const d = await r.json();
                if (d.response) { 
                    st.innerText = `SARA: "${d.response}"`; const low = d.response.toLowerCase();
                    if (low.includes("dashboard khol") || low.includes("opening dashboard") || low.includes("dashboard khol rahi hu")) setDashboardView(true);
                    if (low.includes("dashboard band") || low.includes("closing dashboard") || low.includes("dashboard band kar rahi hu")) setDashboardView(false);
                    speak(d.response);
                } else { speak("Boss, mujhe aapka jawab nahi mila."); }
            } catch (error) { 
                console.error("Network Link Error:", error);
                speak("Sorry Boss, lagta hai network dikkat de raha hai!"); 
            }
        }
        function speak(t) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(t); u.lang = 'hi-IN';
                u.onstart = () => { triggerLipSync(true); document.getElementById("saraLiveStatus").innerText = "● SPEAKING"; };
                u.onend = () => resetToIdleState(); window.speechSynthesis.speak(u);
            } else { resetToIdleState(); }
        }
    </script>
</body>
</html>
